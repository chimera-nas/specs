# S3 gives a bucket no lifetime: a lifecycle rule expires what is IN a bucket,
# never the bucket.  The `aws` job of build.yml creates buckets and removes
# them itself, three times over -- as each trace ends, as the job ends, and as
# the next run starts.  This is the fourth, for the case where there is no
# next run: it removes any test bucket old enough that no live run owns it.
name: AWS bucket sweep

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Delete test buckets older than three hours
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          python3 harness/s3/s3_sweep.py --prefix chimera-ci-mbt- \
            --max-age-hours 3
