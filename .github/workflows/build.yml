name: build-specs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # publish the trace bundle to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned quint
        run: |
          npm i -g "@informalsystems/quint@$(cat .quint-version)"
          quint --version

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Configure + build (generate traces; self-tests gate the build)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Coverage gates
        run: ctest --test-dir build --output-on-failure

      - name: Bundle
        run: cmake --build build --target bundle

      - name: Publish bundle to GHCR (main only, keyed by commit SHA)
        if: github.ref == 'refs/heads/main'
        working-directory: build
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/chimera-nas/specs:${{ github.sha }}" \
              --annotation "org.opencontainers.image.source=https://github.com/chimera-nas/specs" \
              specs-traces.tar.gz:application/gzip
