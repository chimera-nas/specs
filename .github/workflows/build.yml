name: build-specs
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Everything comes from the public registries now: these jobs run on
# GitHub-hosted runners, which have no route to the internal mirrors the
# self-hosted ones used.  The Dockerfile still takes APT_MIRROR and
# DOCKER_MIRROR as ARGs and defaults both to empty, so nothing there has to
# change -- this workflow simply stops overriding them.  What keeps the image
# build cheap is the buildx layer cache below, not a package mirror.
#
# That cache lives in the GitHub Actions cache (type=gha), not in a registry.
# Nothing here pushes an image -- every job builds the devcontainer and loads it
# into its own docker daemon -- so a registry would exist solely to hold cache
# blobs.  The Actions cache also scopes by branch, which does for free what a
# registry needs an explicit ref guard for: a pull request reads the default
# branch's cache and writes only its own scope, so it can never poison main.
# And its read works from a fork's read-only token without depending on how
# package permissions resolve there.  GHCR is left doing the one job it is
# actually for here: holding the published trace bundles.
env:
  # The kvm-test-base guest the knfsd, ext4 and ksmbd conformance jobs boot
  # (it carries nfs-kernel-server as of v1.10.0 and ksmbd-tools as of
  # v1.11.0).  amd64 only -- KVM needs a matching host.
  KNFSD_IMAGE: ghcr.io/chimera-nas/kvm-test-base:ubuntu2404-v1.11.0-amd64

jobs:
  # Heavy: simulates every model to generate the corpus, then runs the coverage
  # gates over it.
  #
  # Everything runs INSIDE the devcontainer image rather than on the runner,
  # even though a GitHub-hosted image comes with a whole SDK preinstalled:
  # reassembling that toolchain on the host one setup-action at a time is both
  # more work and less faithful than using the image that already defines it.
  # .devcontainer is exactly "the dependency set of cmake -B build && cmake
  # --build build && ctest", pinned quint included, which also makes CI and a
  # developer's container the same environment -- so a green run here means the
  # same thing locally.
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # publish the trace bundle to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build the devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: specs-dev:${{ github.sha }}
          cache-from: type=gha,scope=specs-dev
          # The sole writer, and only from main.  The three conformance jobs
          # below build the identical image from the identical Dockerfile and
          # import this same scope, but exporting from all four would be four
          # uploads of identical content racing for last-writer.
          #
          # mode=min, not max: this Dockerfile's weight is one apt/npm install
          # layer rather than a chain of intermediate stages, so min caches
          # substantially the same thing for a fraction of the size -- which
          # matters against a cache quota measured in gigabytes per repository.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=specs-dev,mode=min' || '' }}
          build-args: |
            UBUNTU_MIRROR=azure

      # On the host, not in the image: it is only needed to push the finished
      # bundle, which the bind mount below leaves in the workspace.

      # Only the devliveness gates run here: the conformance suites are the
      # `samba`, `ganesha`, `knfsd`, `ext4`, `windows`, `minio` and `aws` jobs'
      # business and need live servers; this job gates the corpus itself.
      - name: Generate the corpus, gate it, and bundle it
        run: |
          docker run --rm -v "$PWD:/specs" -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              set -e
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
              cmake --build build -j"$(nproc)"
              # The gates that need no server, and they are the ones worth
              # running where the corpus is MADE: devliveness fails when a cell
              # enables a deviation its own corpus never exercises, so a
              # deviation that has been fixed cannot sit on as a blindfold.
              # --no-tests=error because "nothing matched" would otherwise pass
              # silently, which is how the old bundle-era gates went quiet.
              ctest --test-dir build --output-on-failure -L devliveness \
                    --no-tests=error -j "$(nproc)"
              # Archived INSIDE the container, and it has to be: build/ is
              # created here by root through the bind mount, so the runner user
              # cannot write into it from the host.  (The bundle target this
              # replaced ran in here for the same reason.)
              #
              # Tarred from inside the corpus root so it unpacks AS the corpus
              # root, and the conformance jobs can point SPECS_CORPUS_ROOT
              # straight at their unpack directory.
              tar -czf build/specs-corpus.tar.gz -C build/specs-corpus .
            '

      # The corpus is generated exactly once per run.  The conformance jobs
      # below replay THESE bytes rather than regenerating their own, which is
      # cheaper and, more usefully, means what samba/ganesha/knfsd replay is
      # provably the same corpus that was gated here -- not three independent
      # regenerations that merely ought to agree.
      #
      # Nothing is published any more.  There is no prebuilt bundle: a corpus is
      # determined by a CONFIG, and configs belong to the consumer, so a corpus
      # built here could not reflect one.  chimera generates its own from these
      # models plus its own configs on every build.
      - name: Upload the corpus for the conformance jobs
        uses: actions/upload-artifact@v4
        with:
          name: specs-corpus
          path: build/specs-corpus.tar.gz
          retention-days: 1
          if-no-files-found: error


  # Replay the generated SMB2 corpus against a real Samba server.  This is what
  # keeps the models honest: a model developed alongside one implementation
  # drifts toward it, and an unrelated server is the cheapest way to notice.
  # Runs in its own job, in the devcontainer image (which carries Samba and the
  # replay client), privileged because each test isolates its smbd in a network
  # namespace so the batches can run concurrently on :445.
  samba:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # Import only; the build job above owns this scope.  load: true because
      # the image is used by `docker run` in the steps below rather than pushed
      # anywhere.
      - name: Build the devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: specs-dev:${{ github.sha }}
          cache-from: type=gha,scope=specs-dev
          build-args: |
            UBUNTU_MIRROR=azure

      # The corpus comes from the build job rather than being regenerated here.
      # SPECS_CORPUS_PREBUILT makes cmake treat the traces as inputs, so this
      # configure registers the replay tests against them and emits no
      # generation edges at all.
      - name: Fetch the corpus generated by the build job
        uses: actions/download-artifact@v4
        with:
          name: specs-corpus
          path: .

      - name: Unpack the corpus and configure against it
        run: |
          mkdir -p prebuilt-corpus
          tar -xzf specs-corpus.tar.gz -C prebuilt-corpus
          echo "corpus: $(find prebuilt-corpus -name '*.itf.json' | wc -l) traces"
          docker run --rm --privileged -v "$PWD:/specs" -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              set -e
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DSPECS_CORPUS_ROOT=/specs/prebuilt-corpus -DSPECS_CORPUS_PREBUILT=ON
              cmake --build build -j"$(nproc)"
            '

      # Split from generation so a replay failure is not buried under twenty
      # minutes of trace generation, and run VERBOSE: each batch stands up its
      # own smbd, and when something goes wrong at the process level the useful
      # evidence is how far each script got, which --output-on-failure cannot
      # show for a test that never completed.
      - name: Replay the corpus against samba
        run: |
          docker run --rm --privileged -v "$PWD:/specs" -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              ctest --test-dir build -L samba -V --no-tests=error -j 2
              rc=$?
              if [ "$rc" != 0 ]; then
                echo "=== ctest exited $rc; LastTest.log ==="
                tail -400 build/Testing/Temporary/LastTest.log 2>/dev/null || true
              fi
              exit $rc
            '

  # Replay the generated NFSv3 and NFSv4 corpora against a real NFS-Ganesha
  # server, for the same reason the samba job exists: the NFS models were
  # written alongside one implementation, and an unrelated one is the cheapest
  # way to find where the two agreed on something the RFCs never said.
  # Privileged: each batch runs its servers in a network namespace and
  # loop-mounts an ext4 image for the export.
  ganesha:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build the devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: specs-dev:${{ github.sha }}
          cache-from: type=gha,scope=specs-dev
          build-args: |
            UBUNTU_MIRROR=azure

      # What this runner can host, recorded once per run so a SKIP has a
      # visible cause: the kernel NFS server needs /dev/kvm (a guest) or a host
      # nfsd module; ganesha needs loop devices for its export.
      - name: Probe the runner
        run: |
          echo "kernel: $(uname -r)"
          ls -l /dev/kvm 2>&1 || true
          grep -E '^(nfsd|nfs|loop) ' /proc/modules || echo "no nfsd/loop modules listed"
          ls /dev/loop-control /dev/loop0 2>&1 || true
          docker run --rm --privileged specs-dev:${{ github.sha }} \
            bash -c 'ls -l /dev/kvm /dev/loop-control 2>&1; ganesha.nfsd -v | head -1'

      # The corpus comes from the build job rather than being regenerated here.
      # SPECS_CORPUS_PREBUILT makes cmake treat the traces as inputs, so this
      # configure registers the replay tests against them and emits no
      # generation edges at all.
      - name: Fetch the corpus generated by the build job
        uses: actions/download-artifact@v4
        with:
          name: specs-corpus
          path: .

      - name: Unpack the corpus and configure against it
        run: |
          mkdir -p prebuilt-corpus
          tar -xzf specs-corpus.tar.gz -C prebuilt-corpus
          echo "corpus: $(find prebuilt-corpus -name '*.itf.json' | wc -l) traces"
          docker run --rm --privileged -v "$PWD:/specs" -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              set -e
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DSPECS_CORPUS_ROOT=/specs/prebuilt-corpus -DSPECS_CORPUS_PREBUILT=ON
              cmake --build build -j"$(nproc)"
            '

      - name: Replay the corpus against ganesha
        run: |
          docker run --rm --privileged -v "$PWD:/specs" -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              ctest --test-dir build -L ganesha -V --no-tests=error -j 2
              rc=$?
              if [ "$rc" != 0 ]; then
                echo "=== ctest exited $rc; LastTest.log ==="
                tail -600 build/Testing/Temporary/LastTest.log 2>/dev/null || true
              fi
              exit $rc
            '

  # Replay the corpus against the Linux kernel NFS server (knfsd), booted in a
  # KVM guest -- a third, unrelated reference beside Ganesha and the model.
  # Privileged (which exposes /dev/kvm, as chimera's KVM jobs rely on) and
  # amd64 only.  The guest image is fetched with oras on the host and bind
  # mounted; each batch boots one guest and drives it over a TAP link.
  knfsd:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build the devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: specs-dev:${{ github.sha }}
          cache-from: type=gha,scope=specs-dev
          build-args: |
            UBUNTU_MIRROR=azure

      - name: Install oras
        uses: oras-project/setup-oras@v1

      # The guest is an opaque OCI artifact (vmlinuz + initrd + rootfs.qcow2),
      # pulled on the host; the container only needs the files, not oras.
      - name: Fetch the knfsd guest image
        run: |
          mkdir -p kvm-image
          oras pull "${KNFSD_IMAGE}" --output kvm-image
          ls -l kvm-image

      - name: Probe the runner
        run: |
          echo "kernel: $(uname -r)"
          ls -l /dev/kvm 2>&1 || echo "no /dev/kvm on the host"

      # The corpus comes from the build job rather than being regenerated here.
      # SPECS_CORPUS_PREBUILT makes cmake treat the traces as inputs, so this
      # configure registers the replay tests against them and emits no
      # generation edges at all.
      - name: Fetch the corpus generated by the build job
        uses: actions/download-artifact@v4
        with:
          name: specs-corpus
          path: .

      - name: Unpack the corpus and configure against it
        run: |
          mkdir -p prebuilt-corpus
          tar -xzf specs-corpus.tar.gz -C prebuilt-corpus
          echo "corpus: $(find prebuilt-corpus -name '*.itf.json' | wc -l) traces"
          docker run --rm --privileged -v "$PWD:/specs" -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              set -e
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DSPECS_CORPUS_ROOT=/specs/prebuilt-corpus -DSPECS_CORPUS_PREBUILT=ON
              cmake --build build -j"$(nproc)"
            '

      - name: Replay the corpus against knfsd
        run: |
          docker run --rm --privileged \
            -v "$PWD:/specs" -v "$PWD/kvm-image:/kvm-image:ro" \
            -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DSPECS_CORPUS_ROOT=/specs/prebuilt-corpus -DSPECS_CORPUS_PREBUILT=ON \
                    -DSPECS_KNFSD_TESTS=ON -DKVM_IMAGE_DIR=/kvm-image
              ctest --test-dir build -L knfsd -V --no-tests=error -j 2
              rc=$?
              if [ "$rc" != 0 ]; then
                echo "=== ctest exited $rc; LastTest.log ==="
                tail -600 build/Testing/Temporary/LastTest.log 2>/dev/null || true
              fi
              exit $rc
            '

  # The SMB2 corpus replayed against ksmbd, the Linux kernel's SMB server, in
  # the same guest the knfsd job boots, with the replayer the Samba and Windows
  # jobs use.
  ksmbd:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build the devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: specs-dev:${{ github.sha }}
          cache-from: type=gha,scope=specs-dev
          build-args: |
            UBUNTU_MIRROR=azure

      - name: Install oras
        uses: oras-project/setup-oras@v1

      # The guest is an opaque OCI artifact (vmlinuz + initrd + rootfs.qcow2),
      # pulled on the host; the container only needs the files, not oras.
      - name: Fetch the guest image
        run: |
          mkdir -p kvm-image
          oras pull "${KNFSD_IMAGE}" --output kvm-image
          ls -l kvm-image

      - name: Probe the runner
        run: |
          echo "kernel: $(uname -r)"
          ls -l /dev/kvm 2>&1 || echo "no /dev/kvm on the host"

      # The corpus comes from the build job rather than being regenerated here.
      # SPECS_CORPUS_PREBUILT makes cmake treat the traces as inputs, so this
      # configure registers the replay tests against them and emits no
      # generation edges at all.
      - name: Fetch the corpus generated by the build job
        uses: actions/download-artifact@v4
        with:
          name: specs-corpus
          path: .

      - name: Unpack the corpus and configure against it
        run: |
          mkdir -p prebuilt-corpus
          tar -xzf specs-corpus.tar.gz -C prebuilt-corpus
          echo "corpus: $(find prebuilt-corpus -name '*.itf.json' | wc -l) traces"
          docker run --rm --privileged -v "$PWD:/specs" -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              set -e
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DSPECS_CORPUS_ROOT=/specs/prebuilt-corpus -DSPECS_CORPUS_PREBUILT=ON
              cmake --build build -j"$(nproc)"
            '

      - name: Replay the corpus against ksmbd
        run: |
          docker run --rm --privileged \
            -v "$PWD:/specs" -v "$PWD/kvm-image:/kvm-image:ro" \
            -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DSPECS_CORPUS_ROOT=/specs/prebuilt-corpus -DSPECS_CORPUS_PREBUILT=ON \
                    -DSPECS_KSMBD_TESTS=ON -DKVM_IMAGE_DIR=/kvm-image
              ctest --test-dir build -L ksmbd -LE devliveness -V --no-tests=error -j 3
              rc=$?
              if [ "$rc" != 0 ]; then
                echo "=== ctest exited $rc; LastTest.log ==="
                tail -600 build/Testing/Temporary/LastTest.log 2>/dev/null || true
              fi
              exit $rc
            '

  # The POSIX corpus replayed against a real ext4, by real syscalls, in the
  # same guest the knfsd job boots.  A guest is needed for three things the
  # runner cannot give: a scratch ext4 to mkfs, root to become arbitrary uids,
  # and Linux's fs.protected_* sysctls turned off -- they are a hardening
  # policy layered over POSIX and would read as divergences.
  ext4:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build the devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: specs-dev:${{ github.sha }}
          cache-from: type=gha,scope=specs-dev
          build-args: |
            UBUNTU_MIRROR=azure

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Fetch the guest image
        run: |
          mkdir -p kvm-image
          oras pull "${KNFSD_IMAGE}" --output kvm-image
          ls -l kvm-image

      - name: Fetch the corpus generated by the build job
        uses: actions/download-artifact@v4
        with:
          name: specs-corpus
          path: .

      - name: Unpack the corpus and configure against it
        run: |
          mkdir -p prebuilt-corpus
          tar -xzf specs-corpus.tar.gz -C prebuilt-corpus
          echo "corpus: $(find prebuilt-corpus -name '*.itf.json' | wc -l) traces"

      - name: Replay the corpus against ext4
        run: |
          docker run --rm --privileged \
            -v "$PWD:/specs" -v "$PWD/kvm-image:/kvm-image:ro" \
            -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DSPECS_CORPUS_ROOT=/specs/prebuilt-corpus -DSPECS_CORPUS_PREBUILT=ON \
                    -DSPECS_EXT4_TESTS=ON -DKVM_IMAGE_DIR=/kvm-image
              ctest --test-dir build -L ext4 -V --no-tests=error -j 2
              rc=$?
              if [ "$rc" != 0 ]; then
                echo "=== ctest exited $rc; LastTest.log ==="
                tail -600 build/Testing/Temporary/LastTest.log 2>/dev/null || true
              fi
              exit $rc
            '
  # Replay the generated SMB2 corpus against the Windows SMB server itself --
  # the implementation MS-SMB2 and MS-FSA describe -- on Windows Server and on
  # Windows 11.  The same replayer and the same flavours as the samba job, so
  # the two servers are asked exactly the same questions.
  #
  # No container: the server under test is the runner's own in-box LanmanServer,
  # which harness/windows/run_windows_mbt.ps1 reconfigures (a share over a
  # fresh NTFS directory, oplocks and leasing off).  The corpus is the one the
  # build job generated; nothing here needs quint or cmake, only Python and
  # the replay client.
  windows:
    name: windows (${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025,   os: "Server 2025", label: server2025 }
          - { runner: windows-11-arm, os: "Windows 11",  label: windows11 }
    steps:
      - uses: actions/checkout@v4

      # An x64 interpreter on both, including the ARM64 Windows 11 runner,
      # where it runs emulated: the replay client depends on `cryptography`,
      # which publishes no ARM64 Windows wheel and does not build from source
      # there.  Only the client is emulated; the server under test is the
      # machine's own.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Fetch the corpus generated by the build job
        uses: actions/download-artifact@v4
        with:
          name: specs-corpus
          path: .

      # The same pin the devcontainer carries for the samba job; see the note
      # there on why it is exact.
      - name: Unpack the corpus and install the replay client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force prebuilt-corpus | Out-Null
          tar -xzf specs-corpus.tar.gz -C prebuilt-corpus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "corpus: $((Get-ChildItem prebuilt-corpus/windows -Recurse -Filter *.itf.json).Count) windows traces"
          python --version
          python -m pip install --disable-pip-version-check smbprotocol==1.17.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Replay the corpus against the Windows SMB server
        shell: pwsh
        run: |
          # The full CHANGE_NOTIFY flavour reports and does not gate: see
          # harness/windows/README.md for what is still open there.
          ./harness/windows/run_windows_mbt.ps1 -CorpusRoot prebuilt-corpus -LogDir replay-logs -ReportOnly notify
          exit $LASTEXITCODE

      - name: Upload the replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-replay-${{ matrix.label }}
          path: replay-logs/
          if-no-files-found: warn
          retention-days: 14

  # Replay the generated S3 corpus against a real MinIO server, for the same
  # reason the samba job exists: the s3 model was written alongside one
  # filesystem-backed gateway, and an object store nobody consulted is the
  # cheapest way to find what the two had quietly agreed on.
  #
  # Unprivileged, unlike its siblings: MinIO needs no privileged port, so each
  # test takes a free loopback port and there is no namespace to create.  The
  # server itself is built into the devcontainer image from chimera-nas/minio.
  minio:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # Import only; the build job above owns this scope.
      - name: Build the devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: specs-dev:${{ github.sha }}
          cache-from: type=gha,scope=specs-dev
          build-args: |
            UBUNTU_MIRROR=azure

      - name: Fetch the corpus generated by the build job
        uses: actions/download-artifact@v4
        with:
          name: specs-corpus
          path: .

      - name: Unpack the corpus and configure against it
        run: |
          mkdir -p prebuilt-corpus
          tar -xzf specs-corpus.tar.gz -C prebuilt-corpus
          echo "corpus: $(find prebuilt-corpus -name '*.itf.json' | wc -l) traces"
          docker run --rm -v "$PWD:/specs" -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              set -e
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DSPECS_CORPUS_ROOT=/specs/prebuilt-corpus -DSPECS_CORPUS_PREBUILT=ON
              cmake --build build -j"$(nproc)"
            '

      - name: Replay the corpus against minio
        run: |
          docker run --rm -v "$PWD:/specs" -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              ctest --test-dir build -L minio -V --no-tests=error -j 2
              rc=$?
              if [ "$rc" != 0 ]; then
                echo "=== ctest exited $rc; LastTest.log ==="
                tail -400 build/Testing/Temporary/LastTest.log 2>/dev/null || true
              fi
              exit $rc
            '

  # Replay the generated S3 corpus against Amazon S3 itself.  The s3 model
  # states the AWS S3 API Reference, and AWS is the only server that can say
  # whether the model read it correctly.
  #
  # The credentials are an IAM user's, held as repository secrets, with rights
  # on ONE bucket and nothing else; the bucket and its region are repository
  # variables.  The bucket is shared with other pipelines, so every trace keeps
  # to a key prefix unique to the run, the cell and the trace, and touches
  # nothing bucket-wide.  Nothing is cleaned up here: the bucket's lifecycle
  # rule expires objects and unfinished multipart uploads after a day.
  #
  # A pull request from a fork gets no secrets.  The replay then reports a SKIP
  # rather than failing, so the job stays green there and CI complete can
  # still require it; in this repository itself, missing credentials are an
  # error, because a silently skipped suite reads as a passing one.
  aws:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # What every bucket the bucket cells create is named under; the
      # credentials hold rights on <prefix>-* and on nothing else they could
      # create.
      AWS_S3_BUCKET_PREFIX: chimera-ci-mbt
    steps:
      - uses: actions/checkout@v4

      - name: Require the credentials where they should exist
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_S3_BUCKET AWS_REGION; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set for this repository; the AWS replay would be skipped"
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # Import only; the build job above owns this scope.
      - name: Build the devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: specs-dev:${{ github.sha }}
          cache-from: type=gha,scope=specs-dev
          build-args: |
            UBUNTU_MIRROR=azure

      - name: Fetch the corpus generated by the build job
        uses: actions/download-artifact@v4
        with:
          name: specs-corpus
          path: .

      - name: Unpack the corpus and configure against it
        run: |
          mkdir -p prebuilt-corpus
          tar -xzf specs-corpus.tar.gz -C prebuilt-corpus
          echo "corpus: $(find prebuilt-corpus -name '*.itf.json' | wc -l) traces"
          docker run --rm -v "$PWD:/specs" -w /specs specs-dev:${{ github.sha }} \
            bash -c '
              set -e
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DSPECS_CORPUS_ROOT=/specs/prebuilt-corpus -DSPECS_CORPUS_PREBUILT=ON
              cmake --build build -j"$(nproc)"
            '

      # The bucket cells create real buckets and delete them as each trace
      # ends, but a cancelled run never gets that far and S3 gives a bucket no
      # lifetime of its own.  So before replaying, remove what earlier runs
      # leaked -- only buckets old enough that no live run can still own them.
      # Housekeeping, not a verdict: it does not fail the job.
      - name: Sweep buckets leaked by earlier runs
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          python3 harness/s3/s3_sweep.py --prefix "${AWS_S3_BUCKET_PREFIX}-" \
            --max-age-hours 3 || echo "::warning::bucket sweep failed"

      # -e NAME with no value passes the variable through from this step's
      # environment, so the secret never appears on a command line.  The run
      # id and attempt go in too: they are what makes the key prefix and the
      # bucket names unique.
      - name: Replay the corpus against Amazon S3
        run: |
          docker run --rm -v "$PWD:/specs" -w /specs \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            -e AWS_S3_BUCKET -e AWS_S3_BUCKET_PREFIX -e AWS_REGION \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            specs-dev:${{ github.sha }} \
            bash -c '
              ctest --test-dir build -L aws -V --no-tests=error -j 6
              rc=$?
              if [ "$rc" != 0 ]; then
                echo "=== ctest exited $rc; LastTest.log ==="
                tail -400 build/Testing/Temporary/LastTest.log 2>/dev/null || true
              fi
              exit $rc
            '

      # Whatever happened above -- failed, timed out, cancelled -- nothing of
      # this run's is left behind.  Scoped to this run and attempt, so it
      # cannot touch a concurrent pipeline's buckets.
      - name: Remove this run's buckets
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        run: |
          python3 harness/s3/s3_sweep.py \
            --prefix "${AWS_S3_BUCKET_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-" \
            --max-age-hours 0

  # A single check for the ruleset to require.
  #
  # samba, ganesha, knfsd, ext4, windows, minio and aws all hang off `build`, so requiring `build`
  # alone
  # goes green as soon as the corpus compiles -- while the three conformance
  # replays that actually exercise it are still running.  A pull request could
  # therefore be merged before its own pipeline had finished, which is what this
  # exists to stop.  ext4 is the fifth job this warned about; it is listed
  # below because adding a job without adding it here is the failure mode.
  #
  # Requiring each job by name in the ruleset instead would work until someone
  # adds another, which would then be unguarded until the ruleset was
  # remembered.  One
  # aggregate context that lists its dependencies here keeps that in the file
  # people edit rather than in a setting they do not see.
  ci-complete:
    name: CI complete
    needs: [build, samba, ganesha, knfsd, ext4, windows, minio, aws, ksmbd]
    if: always()
    runs-on: ubuntu-latest
    # It reads `needs` and nothing else -- no checkout, no API call -- so the
    # token it runs with needs no permissions at all.
    permissions: {}
    steps:
      - name: Verify every job succeeded
        run: |
          # Compare results rather than using success(): a job that was skipped
          # never ran, and must not satisfy this for the wrong reason.
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: ${results}"
          for r in ${results}; do
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done
